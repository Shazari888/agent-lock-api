openapi: 3.1.0
info:
  title: AgentLock API
  version: 1.0.0
  description: Deterministic command policy decision API
servers:
  - url: http://localhost:3000
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: healthy
  /v1/validate:
    post:
      summary: Validate one command
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: header
          name: x-api-key
          required: true
          schema: { type: string }
      responses:
        "200":
          description: policy decision
  /v1/validate/batch:
    post:
      summary: Validate commands in batch
      responses:
        "200":
          description: batch decision results
  /v1/policies/{policyId}:
    get:
      summary: Read policy by ID
      parameters:
        - in: path
          name: policyId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: policy object
  /v1/audit:
    get:
      summary: Read tenant audit entries
      responses:
        "200":
          description: audit records
  /v1/keys:
    post:
      summary: Create scoped API key
      responses:
        "201":
          description: created key metadata and plaintext key

