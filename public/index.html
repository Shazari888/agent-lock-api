<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Guard Dashboard</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Agent Guard API</p>
        <h1>Visual Dashboard & Editor</h1>
      </div>
      <div class="status-pill" id="connectionStatus">Ready</div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>Connection</h2>
        <label>Base URL
          <input id="baseUrl" type="text" value="http://127.0.0.1:3000" />
        </label>
        <label>Bearer Token
          <textarea id="bearerToken" rows="4" placeholder="Paste Supabase access token"></textarea>
        </label>
        <label>Agent API Key
          <input id="apiKey" type="text" placeholder="Paste agent API key" />
        </label>
        <div class="button-row">
          <button id="saveSettings">Save</button>
          <button id="refreshAgents" class="secondary">Refresh Agents</button>
          <button id="refreshDashboard" class="secondary">Refresh Dashboard</button>
        </div>
      </section>

      <section class="panel">
        <h2>Agents</h2>
        <div id="agentSummary" class="muted">No agents loaded yet.</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Status</th>
                <th>Budget</th>
                <th>Prefix</th>
              </tr>
            </thead>
            <tbody id="agentTable"></tbody>
          </table>
        </div>
        <div class="button-row">
          <button id="rotateKey">Rotate Key</button>
          <button id="revokeAgent" class="danger">Revoke</button>
          <button id="setContinue" class="secondary">Kill Switch: CONTINUE</button>
          <button id="setStop" class="danger">Kill Switch: STOP</button>
        </div>
      </section>

      <section class="panel">
        <h2>Agent Editor</h2>
        <div class="two-col">
          <label>Selected Agent ID
            <input id="selectedAgentId" type="text" placeholder="Select an agent" />
          </label>
          <label>Selected Agent Name
            <input id="selectedAgentName" type="text" placeholder="Optional label" />
          </label>
        </div>
        <div class="form-grid">
          <label>Create Agent Name
            <input id="createAgentName" type="text" value="Scout" />
          </label>
          <label>Daily Budget
            <input id="createAgentBudget" type="number" min="0" step="0.01" value="1.25" />
          </label>
          <button id="createAgent">Create Agent</button>
        </div>
        <div class="form-grid">
          <label>Pulse Task
            <input id="pulseTask" type="text" value="Analyzing market data" />
          </label>
          <label>Progress %
            <input id="pulseProgress" type="number" min="0" max="100" step="1" value="50" />
          </label>
          <label>Current Cost
            <input id="pulseCost" type="number" min="0" step="0.01" value="0.40" />
          </label>
          <button id="sendPulse">Send Pulse</button>
        </div>
        <div class="form-grid">
          <label>Estimated Next Cost
            <input id="budgetEstimate" type="number" min="0" step="0.01" value="0.25" />
          </label>
          <label>State Summary
            <input id="stateSummary" type="text" value="Last successful step: processed 100 records" />
          </label>
          <label>Kill Switch Command
            <select id="killSwitchCommand">
              <option>CONTINUE</option>
              <option>STOP</option>
            </select>
          </label>
        </div>
        <div class="button-row">
          <button id="checkBudget">Check Budget</button>
          <button id="saveState" class="secondary">Save State</button>
          <button id="loadState" class="secondary">Load State</button>
          <button id="applyKillSwitch" class="secondary">Apply Kill Switch</button>
        </div>
      </section>

      <section class="panel">
        <h2>Request Editor</h2>
        <div class="form-grid">
          <label>Method
            <select id="requestMethod">
              <option>GET</option>
              <option>POST</option>
              <option>PATCH</option>
              <option>DELETE</option>
            </select>
          </label>
          <label>Path
            <input id="requestPath" type="text" value="/dashboard" />
          </label>
          <label>Auth Mode
            <select id="requestAuth">
              <option value="none">None</option>
              <option value="apiKey">Agent API Key</option>
              <option value="bearer">Bearer Token</option>
            </select>
          </label>
        </div>
        <label>JSON Body
          <textarea id="requestBody" rows="8">{}</textarea>
        </label>
        <div class="button-row">
          <button id="sendRequest">Send Request</button>
        </div>
      </section>

      <section class="panel wide">
        <h2>Dashboard Preview</h2>
        <pre id="dashboardOutput" class="output"></pre>
      </section>

      <section class="panel wide">
        <h2>Response Log</h2>
        <pre id="responseOutput" class="output"></pre>
      </section>
    </main>

    <script src="/ui/app.js"></script>
  </body>
</html>
